<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <!-- style for the loader -->
    <style>
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
    </style>
    
  </head>
  <body>
    <div class="arjs-loader">
      <div>Loading, please wait...</div>
    </div>
    
    <a-scene vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;">

      <a-nft
        type="nft"
        url="<path-to-your-image-descriptors>"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">
          <!-- as a child of the a-nft entity, you can define the content to show. here's a GLTF model entity -->
          <a-entity
          gltf-model="https://arjs-cors-proxy.herokuapp.com/https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
              scale="5 5 5"
              position="100 100 0"
          >
          </a-entity>
      </a-nft>
      <!-- static camera that moves according to the device movemenents -->
      <a-entity camera></a-entity>

      <a-assets>
        <img id="image1" src="NoOnesPlace_001.jpg">
        <img id="image2" src="NoOnesPlace_002.jpg">
        <img id="image3" src="NoOnesPlace_003.jpg">
        <video id="Video1" src="videotest-High.mp4" autoplay loop="true" crossorigin="anonymous" webkit-playsinline playsinline preload="auto"></video>
      </a-assets>
      
      <!--<a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-sphere position="5 1.25 -8" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-sphere position="10 1.25 -8" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="5" color="#FFC65D"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>-->

      <a-video src="#Video1" position="0 1 -4" rotation="0 0 0" width="4" height="1.5"></a-video>
      
      <!--<a-image src="#image1" material="blening: multiply; transparent: true; opacity: 0.85" position="1 0.75 -8" height="18" width="40" rotation="0 0 0"></a-image>
      <a-image src="#image2" material="blending: multiply; transparent: true; opacity: 0.85" position="1 0.75 -16" height="18" width="40" rotation="0 -90 0"></a-image>
      <a-image src="#image3" material="blending: multiply; transparent: true; opacity: 0.85" position="1 0.75 10" height="18" width="40" rotation="0 -45 0"></a-image>-->

      <a-sky color="#5AB4B8"></a-sky>
    </a-scene>
  </body>
</html>
